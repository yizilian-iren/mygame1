# Publish the Godot web export (Bulids/Web) to GitHub Pages: https://yizilian-iren.github.io/mygame1/
# The export has thread support off, so it runs without cross-origin isolation headers (Pages can't set them).
name: Pages

on:
  push:
    branches: [main]
    paths: ['Bulids/Web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Bulids/Web
      - id: deployment
        uses: actions/deploy-pages@v5
